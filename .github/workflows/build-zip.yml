name: Build and verify ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build, test, package and verify
        run: npm run release
      - name: Locate this build's ZIP
        id: package
        shell: pwsh
        run: |
          $package = Get-Content '.work/current-deploy-package.json' -Raw | ConvertFrom-Json
          "zip=$($package.zip)" >> $env:GITHUB_OUTPUT
      - name: Upload verified ZIP and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clutch-hit-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
